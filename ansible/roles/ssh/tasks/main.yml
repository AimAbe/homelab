---
# A drop-in instead of editing sshd_config: Debian 12's sshd_config `Include`s
# sshd_config.d/*.conf at the top, and the first value sshd reads wins.
- name: Harden sshd (key-only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    content: |
      # Managed by Ansible (ansible/roles/ssh) — see docs/phases/04-ssh-keys.md
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
