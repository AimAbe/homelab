---
# Installs Tailscale from its official repo. Logging the machine in to your
# tailnet (`sudo tailscale up`) stays manual — it's a one-time browser auth.
- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/debian
    suites: ["{{ ansible_distribution_release }}"]
    components: [main]
    signed_by: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
