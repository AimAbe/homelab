version: "3.8"

# Prometheus + Grafana + node_exporter + cAdvisor.
# Copy this directory to ~/homelab/monitoring/ on the lab machine.

networks:
  monitoring:
    external: true
    name: monitoring   # created once, up front — see phase 8 step 2. Lets the
                        # phase-10 Loki stack join and be reachable from Grafana.
  proxy:
    external: true
    name: proxy   # shared with Traefik once phase 11 is done; harmless before then

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro   # phase 17
      - prometheus-data:/prometheus
    networks:
      - monitoring
    # Not published to the host on purpose — Grafana reaches it by service name
    # (http://prometheus:9090), and Traefik can expose it later if you ever want
    # the Prometheus UI itself behind a hostname.

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.homelab`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"   # so filesystem metrics (and DiskSpaceLow) see the host's disks
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  # --- Phase 17: alerting ---------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./webhook-password:/etc/alertmanager/webhook-password:ro   # git-ignored
      - alertmanager-data:/alertmanager   # silences + notification log
    networks:
      - monitoring
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alerts.homelab`)"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

  # Translates Alertmanager webhooks into readable ntfy notifications.
  alertmanager-ntfy:
    image: ghcr.io/alexbakker/alertmanager-ntfy:latest
    container_name: alertmanager-ntfy
    restart: unless-stopped
    command: ["--configs", "/config/config.yml,/config/auth.yml"]
    volumes:
      - ./alertmanager-ntfy.yml:/config/config.yml:ro
      - ./alertmanager-ntfy-auth.yml:/config/auth.yml:ro   # git-ignored
    networks:
      - monitoring
