# `container:` gives each tile a live up/down dot via config/docker.yaml.
# Widget URLs use Docker service names on the shared `proxy` network, not the
# *.homelab hostnames, so they don't depend on DNS.
# Remove a service whose stack you haven't deployed yet, or it will show as down.

- Monitoring:
    - Grafana:
        icon: grafana.png
        href: http://grafana.homelab
        description: Dashboards
        server: homelab-docker
        container: grafana
    - Alertmanager:
        icon: alertmanager.png
        href: http://alerts.homelab
        description: Active alerts and silences
        server: homelab-docker
        container: alertmanager
    - ntfy:
        icon: ntfy.png
        href: http://ntfy.homelab
        description: Push notifications
        server: homelab-docker
        container: ntfy
    - Dozzle:
        icon: dozzle.png
        href: http://dozzle.homelab
        description: Live container logs
        server: homelab-docker
        container: dozzle

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://jellyfin.homelab
        description: Movies and shows
        server: homelab-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

- Services:
    - Paperless:
        icon: paperless-ngx.png
        href: http://paperless.homelab
        description: Scanned documents
        server: homelab-docker
        container: paperless
        widget:
          type: paperlessngx
          url: http://paperless:8000
          key: "{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}"
    - Gitea:
        icon: gitea.png
        href: http://gitea.homelab
        description: Git + Obsidian vault
        server: homelab-docker
        container: gitea
    - code-server:
        icon: code-server.png
        href: http://code.homelab
        description: VS Code in the browser
        server: homelab-docker
        container: code-server

- Infrastructure:
    - AdGuard Home:
        icon: adguard-home.png
        href: http://adguard.homelab
        description: DNS + ad blocking
        server: homelab-docker
        container: adguard
        widget:
          type: adguard
          url: http://adguard:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - Traefik:
        icon: traefik.png
        href: http://homelab:8080
        description: Reverse proxy
        server: homelab-docker
        container: traefik
        widget:
          type: traefik
          url: http://traefik:8080
    - Portainer:
        icon: portainer.png
        href: http://portainer.homelab
        description: Container management
        server: homelab-docker
        container: portainer
