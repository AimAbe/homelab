version: "3.8"

# Jellyfin media server. Update MEDIA_PATH below to wherever the media drive is
# mounted (see phase 12).

networks:
  proxy:
    external: true
    name: proxy

volumes:
  jellyfin-config:
  jellyfin-cache:

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /mnt/media:/media:ro   # external USB drive mount point — see phase 12
    devices:
      - /dev/dri:/dev/dri      # Intel UHD 620 hardware transcoding (QuickSync)
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.homelab`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
