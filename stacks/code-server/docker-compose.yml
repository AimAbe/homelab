version: "3.8"

# code-server: VS Code in the browser, behind Traefik.

networks:
  proxy:
    external: true
    name: proxy

volumes:
  code-server-config:

services:
  code-server:
    image: codercom/code-server:latest
    container_name: code-server
    restart: unless-stopped
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD}   # set in a sibling .env file — see phase 13
    volumes:
      - code-server-config:/home/coder/.config
      - ${HOME}/homelab:/home/coder/homelab
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.codeserver.rule=Host(`code.homelab`)"
      - "traefik.http.services.codeserver.loadbalancer.server.port=8080"
