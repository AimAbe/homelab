version: "3.8"

# ntfy — self-hosted push notifications. Alertmanager (via alertmanager-ntfy in
# the monitoring stack) and Diun publish here; the ntfy phone app subscribes.
# Joins `monitoring` so those senders reach it as http://ntfy, and `proxy` for
# ntfy.homelab. See docs/phases/17-alerting-ntfy.md.

networks:
  proxy:
    external: true
    name: proxy
  monitoring:
    external: true
    name: monitoring

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      TZ: America/New_York
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ./cache:/var/cache/ntfy
      - ./data:/var/lib/ntfy   # user/token database — back this up
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy
      - monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.homelab`)"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
